name: Sync Upstream

on:
  schedule:
    - cron: '0 2 15 * *'   # 每月15日 UTC 2:00 自动运行
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and sync
        run: |
          git remote add upstream https://github.com/byJoey/cfnew.git
          git fetch upstream
          git checkout core-only
          git merge upstream/core-only --no-edit
          git push origin core-only
